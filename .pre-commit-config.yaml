# Fast staged-file hygiene hooks, including mutating Ruff formatting/fixes.
# These hooks do not replace complete candidate or clean GPU qualification.
# Finish all fixes before freezing a candidate; see docs/dev/quality_gates.md.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Hashed JaxMARL copies keep upstream bytes; two have no final newline.
        exclude: ^tests/fixtures/baseline_donor/source/jaxmarl/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        # The hashed donor fixtures retain full gradients and Adam state.
        exclude: ^tests/fixtures/baseline_donor/(recurrent_mappo|ppo_variants|qmix|mappo_registration_params|pqn)\.npz$

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
