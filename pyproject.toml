# Python package, dependency groups and developer-tool configuration.
# pyproject.toml declares intent; uv.lock records exact resolved versions.
# Runtime code lives under src. Training/interop extras install dependencies,
# not a complete learner or every adapter. See docs/dev/dependency_policy.md.
[project]
name = "marl-battlegrounds"
version = "0.0.0"
description = "A JAX-native environment suite and benchmark for heterogeneous adversarial multi-agent reinforcement learning."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
authors = [
  { name = "Ulixes Tariq Hawili" }
]
dependencies = [
  "jax==0.10.1",
  "numpy",
  "scipy",
  "chex",
  "omegaconf",
  "hydra-core>=1.3.4",
  "pydantic",
]

[project.optional-dependencies]
cuda13 = [
  "jax[cuda13]==0.10.1",
]

training = [
  "optax",
  "flax",
  "orbax-checkpoint",
]

interop = [
  "gymnasium",
  "pettingzoo",
]

viz = [
  "matplotlib",
]

dev = [
  "pytest",
  "ruff",
  "pyright",
  "pre-commit",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marl_battlegrounds"]

[tool.hatch.build.targets.wheel.force-include]
"web/visual_debugger/index.html" = "marl_battlegrounds/viewer/web/index.html"
"web/visual_debugger/styles.css" = "marl_battlegrounds/viewer/web/styles.css"
"web/visual_debugger/src" = "marl_battlegrounds/viewer/web/src"
"web/visual_debugger/assets" = "marl_battlegrounds/viewer/web/assets"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
  "/web/visual_debugger/index.html",
  "/web/visual_debugger/styles.css",
  "/web/visual_debugger/src",
  "/web/visual_debugger/assets",
]

[tool.uv]
constraint-dependencies = [
  "msgpack>=1.2.1",
  "pillow>=12.3.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "N",
  "ANN",
  "SIM",
  "RUF",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = [
  "src",
  "tests",
  "scripts/dev/visual_debugger",
  "scripts/dev/debug_renderer.py",
  "scripts/dev/replay_viewer.py",
]
exclude = [
  "**/__pycache__",
  ".venv",
  "artifacts",
  "runs",
  "outputs",
  "checkpoints",
]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportUnknownMemberType = "none"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
