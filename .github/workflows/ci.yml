name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync environment
        run: uv sync --locked --extra dev --extra viz

      - name: Run tests
        run: uv run pytest

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linter
        run: uv run ruff check .

      - name: Run type checker
        run: uv run pyright

  frontend-gates:
    name: Frontend and browser gates
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync Python environment
        run: uv sync --locked --extra dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/visual_debugger/package-lock.json

      - name: Install frontend dependencies
        working-directory: web/visual_debugger
        run: npm ci

      - name: Install Chromium
        working-directory: web/visual_debugger
        run: npx playwright install --with-deps chromium

      - name: Run frontend and browser gates
        run: scripts/dev/check_frontend.sh

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-debugger-browser-failures
          path: web/visual_debugger/test-results
          if-no-files-found: ignore
          retention-days: 7
