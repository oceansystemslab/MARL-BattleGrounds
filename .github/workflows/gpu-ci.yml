name: GPU CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run the complete GPU regression suite
        required: false
        type: boolean
        default: false

concurrency:
  group: gpu-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-sanity:
    name: GPU sanity
    runs-on: [self-hosted, Linux, X64, gpu, rtx5090]
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check uv
        run: uv --version

      - name: Sync environment
        run: uv sync --locked --extra cuda13 --extra dev

      - name: Check NVIDIA driver
        run: nvidia-smi

      - name: Check JAX GPU backend
        run: |
          uv run python - <<'PY'
          import jax
          import jax.numpy as jnp

          print("jax", jax.__version__)
          print("backend", jax.default_backend())
          print("devices", jax.devices())

          if jax.default_backend() != "gpu":
              raise RuntimeError("Expected JAX GPU backend")

          x = jnp.ones((2048, 2048), dtype=jnp.float32)
          y = (x @ x).block_until_ready()

          print("result", y.shape, y.device)
          PY

      - name: Check compiled environment contracts on GPU
        run: >-
          uv run pytest
          tests/test_core_spine.py::test_that_step_can_be_jit_compiled
          tests/test_core_spine.py::test_step_can_run_in_scanned_rollout
          -q
          --maxfail=1

  gpu-full-regression:
    name: GPU full regression
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.full_regression)
    needs: gpu-sanity
    runs-on: [self-hosted, Linux, X64, gpu, rtx5090]
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync complete GPU environment
        run: >-
          uv sync --locked
          --extra cuda13
          --extra training
          --extra interop
          --extra viz
          --extra dev

      - name: Run complete GPU regression
        run: uv run pytest --maxfail=1
